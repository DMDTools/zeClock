name: Tests

on:
  push:
    branches: [main, develop, feat/plugins-system]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run linter
        run: |
          flake8 zeclock/ --max-line-length=120 --ignore=E501,W503,E203,F841

      - name: Run type checker
        run: |
          mypy zeclock/ --ignore-missing-imports

      - name: Check formatting
        run: |
          black --check zeclock/ tests/
