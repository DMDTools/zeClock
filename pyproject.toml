[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeclock"
version = "0.1.0"
description = "Smart DMD clock for ZeDMD inspired by DotClk"
authors = [{name = "Olivier Jacques", email = "ojacques2@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0",
    "numpy",
    "colorama>=0.4.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
zedmd = [
    "pyserial",
]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/DMDTools/zeClock"
Repository = "https://github.com/DMDTools/zeClock"

[project.scripts]
zeclock = "zeclock.clock:main"

[tool.setuptools.packages.find]
include = ["zeclock*"]

