[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeclock"
version = "0.1.0"
description = "DMD clock compatible with ZeDMD"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pillow",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/yourusername/zeclock"
Repository = "https://github.com/yourusername/zeclock"
