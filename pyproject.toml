[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeclock"
version = "0.1.0"
description = "Smart DMD clock for ZeDMD inspired by DotClk"
authors = [{name = "Olivier Jacques", email = "ojacques2@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0",
    "colorama>=0.4.6",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
zedmd = [
    "pyserial",
]
mqtt = [
    "aiomqtt>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "types-PyYAML>=6.0",
    "pyyaml>=6.0",
    "aiomqtt>=2.0",
]

[project.urls]
Homepage = "https://github.com/DMDTools/zeClock"
Repository = "https://github.com/DMDTools/zeClock"

[project.scripts]
zeclock = "zeclock.clock:main"

[tool.setuptools.packages.find]
include = ["zeclock*"]

[tool.setuptools.package-data]
zeclock = ["resources/Fonts/*.fnt", "remote/web/*.html", "remote/web/*.css", "remote/web/*.js"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
